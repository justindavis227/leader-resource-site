<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1215">
<title>Group Cards — Southeast Students</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{font-family:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
        --mono:'Geist Mono',ui-monospace,'SFMono-Regular',monospace}
  html,body{height:100%}
  body{background:#0f1115;color:#16181d;overflow:hidden}

  /* ---------- HOME ---------- */
  #home{height:100%;overflow-y:auto;background:#fffef9;-webkit-overflow-scrolling:touch;
        padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 40px)}
  .h-title{font-size:24px;font-weight:800;letter-spacing:-.02em;color:#0e1215}
  .h-sub{color:#6b7178;font-size:12px;margin-top:4px;font-family:var(--mono);
         text-transform:uppercase;letter-spacing:.1em}
  .series{margin-top:28px}
  .s-head{display:flex;align-items:center;gap:9px;border-bottom:3px solid;padding-bottom:7px;margin-bottom:14px}
  .s-head h2{font-size:16px;font-weight:800}
  .s-head .sub{font-weight:500;color:#6b7178}
  .dot{width:11px;height:11px;border-radius:50%}
  .weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  .wk-cell{display:flex;flex-direction:column;gap:6px}

  /* mini card-front tile */
  .tile{position:relative;aspect-ratio:350/622;border:none;border-radius:12px;overflow:hidden;
        cursor:pointer;text-align:left;color:#fffef9;display:flex;flex-direction:column;
        justify-content:space-between;padding:11px 11px 10px;transition:transform .1s;
        box-shadow:0 3px 12px rgba(14,18,21,.14);width:100%}
  .tile:active{transform:scale(.96)}
  .tile .t-wm{width:82%;display:block}
  .tile .t-wkline{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.12em;
                  text-transform:uppercase;margin-top:7px;line-height:1.5}
  .tile .t-icon{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 0;min-height:0}
  .tile .t-icon img{width:46%;max-height:76%;object-fit:contain}
  .tile .t-series{font-size:13px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
  .tile .t-ssub{font-size:9.5px;font-weight:600;opacity:.9;margin-top:3px}
  .tile .t-bottom{display:flex;align-items:flex-end;justify-content:space-between}
  .tile .t-sec{font-family:var(--mono);font-size:8.5px;font-weight:700;text-transform:uppercase;
               letter-spacing:.08em;opacity:.9;max-width:58%}
  .tile .t-num{text-align:right;line-height:.85}
  .tile .t-num b{font-size:26px;font-weight:800}
  .tile .t-num i{font-style:normal;font-size:9px;font-weight:600;opacity:.8}

  .wk-actions{display:flex;gap:6px}
  .wk-actions>*{flex:1;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;
        text-transform:uppercase;text-align:center;text-decoration:none;cursor:pointer;
        border:1px solid #e4e0d4;background:#fff;color:#4a4f53;border-radius:999px;padding:6px 4px}
  .wk-actions>*:active{background:#f0ede3}
  .wk-actions .copied,.wk-actions>*.copied{background:#0e1215;color:#d1fb51;border-color:#0e1215}

  /* ---------- VIEWER ---------- */
  #viewer{position:fixed;inset:0;background:#0f1115;display:none;flex-direction:column;
          padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  #viewer.on{display:flex}
  .v-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 6px;color:#fff;flex:none}
  .v-back{background:none;border:none;color:rgba(255,255,255,.75);font-size:14px;font-weight:600;
          display:flex;align-items:center;gap:5px;cursor:pointer;padding:6px 0}
  .v-right{display:flex;align-items:center;gap:12px}
  .v-count{font-size:12px;color:rgba(255,255,255,.6);font-weight:600;font-family:var(--mono)}
  .v-pdf{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
         color:#d1fb51;border:1px solid rgba(209,251,81,.45);border-radius:999px;padding:6px 12px;
         text-decoration:none}
  .v-pdf:active{background:rgba(209,251,81,.15)}

  .stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:6px 14px 10px}
  .cardwrap{position:relative;aspect-ratio:350/622;height:min(100%,calc(min(92vw,380px) * 622 / 350));width:auto}
  .flip{position:absolute;inset:0;perspective:1600px;cursor:pointer}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.15,.2,1);
              transform-style:preserve-3d}
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;
        border-radius:22px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}

  /* front (cover) */
  .front{color:#fff;padding:30px 26px;display:flex;flex-direction:column;justify-content:space-between}
  .front .s-name{font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.01em}
  .front .s-sub{font-size:15px;font-weight:600;opacity:.92;margin-top:5px}
  .front .wk-line{font-size:12px;font-weight:600;opacity:.85;margin-top:10px}
  .front .f-bottom{display:flex;align-items:flex-end;justify-content:space-between}
  .front .sec{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;max-width:62%}
  .front .num{text-align:right;line-height:.9}
  .front .num b{font-size:52px;font-weight:800}
  .front .num i{font-style:normal;font-size:14px;font-weight:600;opacity:.8}
  .front .tap-hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:10px;
                   letter-spacing:.14em;text-transform:uppercase;opacity:.5}
  .kit-wm{width:80%;display:block}
  .kit-wk{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:12px}
  .kit-ic{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0;min-height:0}
  .kit-ic img{width:44%;max-height:150px;object-fit:contain}

  /* back (content) */
  .back{background:#fff;transform:rotateY(180deg);display:flex;flex-direction:column;padding:24px 22px}
  .b-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:9px;
          font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding-bottom:9px;border-bottom:2px solid}
  .b-head .r{flex:none}
  .b-title{font-size:20px;font-weight:800;margin:15px 0 13px}
  .b-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:15px;line-height:1.45;padding-right:2px}
  .kv{margin-bottom:14px}
  .kv .k{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}
  .kv .v{font-size:15px;font-weight:500}
  .qrow{position:relative;padding:0 0 13px 30px}
  .qrow .qn{position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;color:#fff;
            font-size:10px;font-weight:700;text-align:center;line-height:21px}
  .qsub{position:relative;padding:0 0 11px 44px;color:#3c4048}
  .qsub:before{content:"\2013";position:absolute;left:30px;top:0;font-weight:700}
  .prose{font-size:16px;line-height:1.5}
  .blank{color:#9aa0a6;font-style:italic;border:1px dashed #cdd2d8;border-radius:8px;padding:10px 12px}
  .b-foot{flex:none;margin-top:10px;font-size:8px;font-weight:700;text-transform:uppercase;
          letter-spacing:.16em;color:#b6bcc4}

  .v-nav{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 16px 12px;flex:none}
  .pip{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28)}
  .pip.on{background:#fff}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
         background:rgba(255,255,255,.12);border:none;color:#fff;font-size:20px;cursor:pointer;z-index:5;
         display:flex;align-items:center;justify-content:center}
  .arrow:active{background:rgba(255,255,255,.25)}
  .arrow.prev{left:6px}.arrow.next{right:6px}
  .arrow[disabled]{opacity:0;pointer-events:none}
</style>
</head>
<body>
  <div id="home"></div>

  <div id="viewer">
    <div class="v-top">
      <button class="v-back" onclick="closeViewer()">&#8592; All cards</button>
      <div class="v-right">
        <div class="v-count" id="vcount"></div>
        <a class="v-pdf" id="vpdf" href="#" download>PDF</a>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="cardwrap" id="cardwrap">
        <button class="arrow prev" id="prev" onclick="nav(-1)">&#8249;</button>
        <button class="arrow next" id="next" onclick="nav(1)">&#8250;</button>
        <div class="flip" id="flip">
          <div class="flip-inner">
            <div class="face front" id="front"></div>
            <div class="face back" id="back"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="v-nav" id="pips"></div>
  </div>

<script>
const DATA = {"series":[{"n":1,"id":"one-at-a-time","title":"One at a Time","subtitle":"","c1":"#0e1215","c2":"#556114","weeks":[{"week":1,"title":"The Vision of Our Church","pdf":"pdf/S1-W1-one-at-a-time.pdf","cards":[{"n":1,"section":"Intro","label":"Overview","kind":"intro","body":[["Passage","Mark 5:21-43"],["Key Takeaway","Jesus loved people one at a time—so should we."],["Call to Action","Find one person you know who is far from Jesus and commit to loving them."]],"total":6},{"n":2,"section":"Personal","label":"Personal Questions","kind":"list","body":["1. Have you ever been so focused on a task that nothing could stop you from doing it?","2. What is something you would drop anything, no matter how important, to do?"],"total":6},{"n":3,"section":"Biblical","label":"Biblical Questions","kind":"list","body":["1. Read Mark 5:21-43.","What words, ideas, or phrases stick out to you from these verses?","What questions do you have about these verses?","2. Reread Mark 5:21-24. Jesus is surrounded by people, but He chooses to help Jairus. Why just one person?","3. Reread Mark 5:24-34. Jesus let Himself be interrupted by stopping here. Why do you think this is?"],"total":6},{"n":4,"section":"Applicable","label":"Applicable Questions","kind":"list","body":["1. Can you think of one person to commit to loving so they can better know Jesus? Who is it?","2. How can you go out of your way to love people one at a time?"],"total":6},{"n":5,"section":"Prayer","label":"Prayer Prompt","kind":"text","body":"God, thank you for loving me. Give me the eyes to see one person that doesn't know you and help me to love them.","total":6},{"n":6,"section":"Challenge","label":"Personal Challenge","kind":"text","body":"Pray every day for the next week for God to show you one person to focus on loving.","total":6}]},{"week":2,"title":"One Party at a Time","pdf":"pdf/S1-W2-one-at-a-time.pdf","cards":[{"n":1,"section":"Intro","label":"Overview","kind":"intro","body":[["Passage","Luke 14:12-24"],["Key Takeaway","Jesus invites everyone to the party—it's up to us to extend the invitation."],["Call to Action","Make room in community to invite people far from God in and let them be loved."]],"total":6},{"n":2,"section":"Personal","label":"Personal Questions","kind":"list","body":["1. What is your favorite birthday party you had growing up?","2. How would you have felt if nobody you had invited had shown up?"],"total":6},{"n":3,"section":"Biblical","label":"Biblical Questions","kind":"list","body":["1. Read Luke 14:12-24.","What words, ideas, or phrases stick out to you from these verses?","What questions do you have about these verses?","2. Reread Luke 14:16-20. Why were people rejecting the invitation to the feast?","3. Reread Luke 14:21-24. Who does Jesus say should be invited instead?"],"total":6},{"n":4,"section":"Applicable","label":"Applicable Questions","kind":"list","body":["1. What are some excuses you might be using to avoid God's invitation?","2. Who is someone you could make the effort to reach out to and invite to the party?"],"total":6},{"n":5,"section":"Prayer","label":"Prayer Prompt","kind":"text","body":"God, thank you for inviting me to your great party. Help me see the people who don't know they are invited and extend the invite to them.","total":6},{"n":6,"section":"Challenge","label":"Personal Challenge","kind":"text","body":"Plan a hang-out as a group and invite someone who doesn't yet know Jesus.","total":6}]},{"week":3,"title":"One Prayer at a Time","pdf":"pdf/S1-W3-one-at-a-time.pdf","cards":[{"n":1,"section":"Intro","label":"Overview","kind":"intro","body":[["Passage","Luke 18:1-8"],["Key Takeaway","We can love people one at a time by persistently praying for them."],["Call to Action","Pray consistently that people far from God come to know Jesus."]],"total":6},{"n":2,"section":"Personal","label":"Personal Questions","kind":"list","body":["1. How do you feel when you think of prayer?","2. Why do you think God sometimes waits longer to answer prayers?"],"total":6},{"n":3,"section":"Biblical","label":"Biblical Questions","kind":"list","body":["1. Read Luke 18:1-8.","What words, ideas, or phrases stick out to you from these verses?","What questions do you have about these verses?","2. Reread Luke 18:1. What does this say this parable means?","3. Reread Luke 18:6-8. How does this say that God will answer prayers?"],"total":6},{"n":4,"section":"Applicable","label":"Applicable Questions","kind":"list","body":["1. Who is one person you can commit to praying for?","2. How can you build better habits of prayer to bring your requests to God more often?"],"total":6},{"n":5,"section":"Prayer","label":"Prayer Prompt","kind":"text","body":"God, thank you for hearing my prayers. Listen as I call out to you, and reveal yourself to my One.","total":6},{"n":6,"section":"Challenge","label":"Personal Challenge","kind":"text","body":"Set a reminder to pray for your One every day.","total":6}]},{"week":4,"title":"One Conversation at a Time","pdf":"pdf/S1-W4-one-at-a-time.pdf","cards":[{"n":1,"section":"Intro","label":"Overview","kind":"intro","body":[["Passage","John 4:1-45"],["Key Takeaway","We can love people one at a time by having out-of-the-ordinary conversations."],["Call to Action","Be willing to talk with those you normally avoid, and make room to tell them about Jesus."]],"total":6},{"n":2,"section":"Personal","label":"Personal Questions","kind":"list","body":["1. Why is it difficult to talk to people outside of our circle?","2. What kind of people do we typically avoid talking to?"],"total":6},{"n":3,"section":"Biblical","label":"Biblical Questions","kind":"list","body":["1. Read John 4:1-45.","What words, ideas, or phrases stick out to you from these verses?","What questions do you have about these verses?","2. Reread John 4:7-9. Why would Jesus go out of His way to talk to someone He was supposed to avoid?","3. Reread John 4:25-26. This is the first time Jesus told anyone He was the Messiah. Why might He have told a Samaritan woman of all people?"],"total":6},{"n":4,"section":"Applicable","label":"Applicable Questions","kind":"list","body":["1. Who is one person you can reach out to and share the good news of Jesus?","2. How can you break down barriers that might prevent people from hearing about Jesus?"],"total":6},{"n":5,"section":"Prayer","label":"Prayer Prompt","kind":"text","body":"God, thank you for being willing to reach me with your love. Help me to reach those who don't know you, even if it means getting uncomfortable. Amen.","total":6},{"n":6,"section":"Challenge","label":"Personal Challenge","kind":"text","body":"Have one conversation that might be outside your comfort zone with someone who does not know Jesus.","total":6}]},{"week":5,"title":"One Meal at a Time","pdf":"pdf/S1-W5-one-at-a-time.pdf","cards":[{"n":1,"section":"Intro","label":"Overview","kind":"intro","body":[["Passage","Luke 19:1-10"],["Key Takeaway","Sharing a meal opens the door for God to change someone's life."],["Call to Action","Open up your table and time to meet with someone and share the love of Jesus."]],"total":6},{"n":2,"section":"Personal","label":"Personal Questions","kind":"list","body":["1. If you could share a meal with any person throughout history, who would it be?","2. Why do you think some of the best conversations happen when sharing a meal?"],"total":6},{"n":3,"section":"Biblical","label":"Biblical Questions","kind":"list","body":["1. Read Luke 19:1-10.","What words, ideas, or phrases stick out to you from these verses?","What questions do you have about these verses?","2. Reread Luke 19:5-6. How did Zacchaeus react to Jesus inviting Himself over? How did the crowd react? Why do you think this is?","3. Read Acts 2:42-47. The early church shared many meals together. What effect did this have on people who witnessed them?"],"total":6},{"n":4,"section":"Applicable","label":"Applicable Questions","kind":"list","body":["1. Who are some people you wouldn't normally share a meal with? How can you go out of your way to open a table to them?","2. It's easy to make excuses for not sharing a meal with someone. What excuses can you surrender to God so you can love people better?"],"total":6},{"n":5,"section":"Prayer","label":"Prayer Prompt","kind":"text","body":"God, thank you for intentionally meeting me wherever I am. Give me eyes to see who I can invite to my table, your table.","total":6},{"n":6,"section":"Challenge","label":"Personal Challenge","kind":"text","body":"One day this week, look for someone sitting alone at lunch. Sit with them, or invite them to your table.","total":6}]},{"week":6,"title":"One Need at a Time","pdf":"pdf/S1-W6-one-at-a-time.pdf","cards":[{"n":1,"section":"Intro","label":"Overview","kind":"intro","body":[["Passage","Matthew 4:23-25"],["Key Takeaway","We can love people one at a time by meeting their needs."],["Call to Action","Find ways to meet needs."]],"total":6},{"n":2,"section":"Personal","label":"Personal Questions","kind":"list","body":["1. If you could solve one problem in the world with a snap of your fingers, what would it be?","2. What are some things you might be cautious or scared of asking for help with?"],"total":6},{"n":3,"section":"Biblical","label":"Biblical Questions","kind":"list","body":["1. Read Matthew 4:23-25.","What words, ideas, or phrases stick out to you from these verses?","What questions do you have about these verses?","2. Reread Matthew 4:23-25. What sorts of needs does Jesus meet? What does this tell you about the kingdom of heaven?","3. Read Matthew 15:29-31. This wasn't the only time Jesus did this. What does it tell you about Jesus' ministry?"],"total":6},{"n":4,"section":"Applicable","label":"Applicable Questions","kind":"list","body":["1. What normally keeps you from helping meet the needs of others?","2. What are some ways you have been gifted to help meet the needs of others?"],"total":6},{"n":5,"section":"Prayer","label":"Prayer Prompt","kind":"text","body":"God, thank y r the Holy Spirit's help to walk away from sinful desires.","total":6}]},{"week":2,"title":"The World","pdf":"pdf/S2-W2-churchy-words.pdf","cards":[{"n":1,"section":"Intro","label":"Overview","kind":"intro","body":[["Passage","James 4:1-10; 1 John 2:15-17"],["Key Takeaway","You can't be best friends with the world and with God—choose God."],["Call to Action","Identify one way you've been chasing the world's approval and trade it for a habit that draws you closer to God."]],"total":6},{"n":2,"section":"Personal","label":"Personal Questions","kind":"list","body":["1. What's an unpopular opinion you have that your friends would disagree with?","2. Have you ever known the right thing to do but felt pressure to do the opposite? Explain."],"total":6},{"n":3,"section":"Biblical","label":"Biblical Questions","kind":"list","body":["1. Read James 4:1-10.","What words, ideas, or phrases stick out to you from these verses?","What questions do you have about these verses?","2. Reread James 4:4. What does this say about how we relate to God?","3. Reread James 4:10. Instead of being friends of the world, how do we become friends with God?"],"total":6},{"n":4,"section":"Applicable","label":"Applicable Questions","kind":"list","body":["1. Can you name any areas where you are a friend of the world?","2. What is a way you can grow in friendship with God?"],"total":6},{"n":5,"section":"Prayer","label":"Prayer Prompt","kind":"text","body":"God, thank you for not leaving me alone in this broken world. Help me to live as your friend in everything I do.","total":6},{"n":6,"section":"Challenge","label":"Personal Challenge","kind":"text","body":"Examine your habits and identify one way you might be living for the world.","total":6}]},{"week":3,"title":"The Devil","pdf":"pdf/S2-W3-churchy-words.pdf","cards":[{"n":1,"section":"Intro","label":"Overview","kind":"intro","body":[["Passage","James 4:7-8; Ephesians 6:10-18"],["Key Takeaway","The devil is real, but when we submit to God and resist him, he flees."],["Call to Action","Pick the piece of God's armor you're weakest in, and ask God to strengthen you there this week."]],"total":6},{"n":2,"section":"Personal","label":"Personal Questions","kind":"list","body":["1. When you think of the devil, what comes to mind?","2. Where do you struggle resisting temptation?"],"total":6},{"n":3,"section":"Biblical","label":"Biblical Questions","kind":"list","body":["1. Read James 4:7-8.","What words, ideas, or phrases stick out to you from these verses?","What questions do you have about these verses?","2. How does this say we should react when the devil tempts us?","3. Read Ephesians 6:13-18. What tools do we have from God to defend ourselves against attacks from the devil?"],"total":6},{"n":4,"section":"Applicable","label":"Applicable Questions","kind":"list","body":["1. What is an area of your life you need to submit to God?","2. Which part of the \"armor of God\" do you need to grow in?"],"total":6},{"n":5,"section":"Prayer","label":"Prayer Prompt","kind":"text","body":"God, thank you for giving me what I need to resist the devil. Give me strength to keep resisting temptation, and to live for you always.","total":6},{"n":6,"section":"Challenge","label":"Personal Challenge","kind":"text","body":"Read James 4:7 and pray for the strength to submit to God and resist the devil.","total":6}]},{"week":4,"title":"Heaven & Hell","pdf":"pdf/S2-W4-churchy-words.pdf","cards":[{"n":1,"section":"Intro","label":"Overview","kind":"intro","body":[["Passage","James 1:12-15; John 5:25-29; Matthew 13:47-50"],["Key Takeaway","Eternity is real, and God is inviting you—and the people around you—into life with Him forever."],["Call to Action","Respond to God's invitation for yourself, then start one conversation with someone who needs to hear it."]],"total":6},{"n":2,"section":"Personal","label":"Personal Questions","kind":"list","body":["1. When you think of forever, what do you think of?","2. How does talking about heaven and hell make you feel?"],"total":6},{"n":3,"section":"Biblical","label":"Biblical Questions","kind":"list","body":["1. Read James 1:12-15.","What words, ideas, or phrases stick out to you from these verses?","What questions do you have about these verses?","2. Reread James 1:12. What does God promise to those who love Him?","3. Jesus tells a story about judgement in Matthew 13:47-50. What kind of picture does this paint?"],"total":6},{"n":4,"section":"Applicable","label":"Applicable Questions","kind":"list","body":["1. Do you need to respond to the invitation to the kingdom of heaven?","2. Do you know anyone who needs to hear this news? How can you start that conversation?"],"total":6},{"n":5,"section":"Prayer","label":"Prayer Prompt","kind":"text","body":"God, thank you for making a way for me to be with you. Help me live a life that points others toward you so they can also experience eternal life.","total":6},{"n":6,"section":"Challenge","label":"Personal Challenge","kind":"text","body":"Prioritize a time this week to talk honestly with God about where you are with Him, and what one step closer would look like.","total":6}]}]},{"n":3,"id":"beyond-boring","title":"Beyond Boring","subtitle":"","c1":"#1a9cd6","c2":"#116d99","weeks":[{"week":1,"title":"All In","pdf":"pdf/S3-W1-beyond-boring.pdf","cards":[{"n":1,"section":"Intro","label":"Overview","kind":"intro","body":[["Passage","Joshua 1:1-18"],["Key Takeaway","A faith that trusts God completely is anything but boring."],["Call to Action","Name one obstacle keeping your faith \"boring\" and take one concrete step to trust God with it this week."]],"total":6},{"n":2,"section":"Personal","label":"Personal Questions","kind":"list","body":["1. How do you react when you feel bored?","2. How would you describe your relationship with God: boring or beyond boring? Why?"],"total":6},{"n":3,"section":"Biblical","label":"Biblical Questions","kind":"list","body":["1. Read Joshua 1:1-18.","What words, ideas, or phrases stick out to you from these verses?","What questions do you have about these verses?","2. What are some of the promises God makes Israel?","3. Reread Joshua 1:16. How did Israel react when they heard the promises of God?"],"total":6},{"n":4,"section":"Applicable","label":"Applicable Questions","kind":"list","body":["1. What are some obstacles keeping you from living a faith that is beyond boring?","2. What are some ways God may be calling you to put your faith in Him and trust Him more completely?"],"total":6},{"n":5,"section":"Prayer","label":"Prayer Prompt","kind":"text","body":"God, thank you for calling me to deeper faith. Be with me as I step out in faith and learn to trust you more.","total":6},{"n":6,"section":"Challenge","label":"Personal Challenge","kind":"text","body":"Schedule a time this week to evaluate your relationship with God. Ask God where you need to trust Him more.","total":6}]},{"week":2,"title":"Remember","pdf":"pdf/S3-W2-beyond-boring.pdf","cards":[{"n":1,"section":"Intro","label":"Overview","kind":"intro","body":[["Passage","Joshua 3:1-17"],["Key Takeaway","Remembering what God has already done gives us faith to step into what He'll do next."],["Call to Action","Write down three times God showed up for you, and let them push you into one new step of faith."]],"total":6},{"n":2,"section":"Personal","label":"Personal Questions","kind":"list","body":["1. When you are bored, what is your favorite thing to do to break the boredom?","2. If you were trapped in a room without those options, how would you pass the time?"],"total":6},{"n":3,"section":"Biblical","label":"Biblical Questions","kind":"list","body":["1. Read Joshua 3:1-17.","What words, ideas, or phrases stick out to you from these verses?","What questions do you have about these verses?","2. How do you think the Israelites reacted when they crossed the river on dry ground?","3. How do you think it impacted how they thought about what God could do?"],"total":6},{"n":4,"section":"Applicable","label":"Applicable Questions","kind":"list","body":["1. What does it look like for you to have a faith that is beyond boring?","2. What is a way you can actively step into that this week?"],"total":6},{"n":5,"section":"Prayer","label":"Prayer Prompt","kind":"text","body":"God, thank you for the amazing ways you have worked in my life. As I remember what you have done, inspire me to greater faith.","total":6},{"n":6,"section":"Challenge","label":"Personal Challenge","kind":"text","body":"Set a timer for 3 minutes and write out times you can remember God showing up for you. Then write ways you can respond to His actions.","total":6}]},{"week":3,"title":"Stand Out","pdf":"pdf/S3-W3-beyond-boring.pdf","cards":[{"n":1,"section":"Intro","label":"Overview","kind":"intro","body":[["Passage","Joshua 6:1-20"],["Key Takeaway","Following God will sometimes make you stand out—and that's exactly the point."],["Call to Action","Do one thing this week that shows your faith even if it feels weird—like inviting someone new to church."]],"total":6},{"n":2,"section":"Personal","label":"Personal Questions","kind":"list","body":["1. What is something you do that other people think is weird?","2. Does that ever impact how you act?"],"total":6},{"n":3,"section":"Biblical","label":"Biblical Questions","kind":"list","body":["1. Read Joshua 6:1-20.","What words, ideas, or phrases stick out to you from these verses?","What questions do you have about these verses?","2. Reread Joshua 6:2-5. What does God command Joshua?","3. Why would God command something that might not make sense?"],"total":6},{"n":4,"section":"Applicable","label":"Applicable Questions","kind":"list","body":["1. What is one way your faith in Jesus might cause you to stand out among your peers?","2. How does it help knowing that you aren't alone?"],"total":6},{"n":5,"section":"Prayer","label":"Prayer Prompt","kind":"text","body":"God, thank you for putting people around me to strengthen my faith. As I grow in community, help me grow in confide /* ---------- helpers ---------- */
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function weekHash(si,wi){return '#s'+DATA.series[si].n+'w'+DATA.series[si].weeks[wi].week;}
function weekURL(si,wi){return location.protocol==='file:'
  ? location.href.split('#')[0]+weekHash(si,wi)
  : location.origin+location.pathname+weekHash(si,wi);}

/* ---------- HOME ---------- */
function tileHTML(s,si,w,wi){
  const wkline='WEEK '+w.week+(w.title?' &middot; '+esc(w.title):'');
  if(s.kit){
    const icon=(s.kit.weekIcons||[])[w.week-1];
    return '<button class="tile" style="background:'+s.kit.bg+'" onclick="openViewer('+si+','+wi+')">'
      + '<div>'
      + (s.kit.wordmark
          ? '<img class="t-wm" src="'+s.kit.wordmark+'" alt="">'
          : '<div class="t-series" style="color:'+s.kit.ink+'">'+esc(s.title)+'</div>'
            + (s.subtitle?'<div class="t-ssub" style="color:'+s.kit.ink+'">'+esc(s.subtitle)+'</div>':''))
      + '<div class="t-wkline" style="color:'+s.kit.ink+'">'+wkline+'</div></div>'
      + (icon?'<div class="t-icon"><img src="'+icon+'" alt=""></div>':'<div class="t-icon"></div>')
      + '<div class="t-bottom"><div class="t-sec">'+w.cards.length+' cards</div>'
      + '<div class="t-num" style="color:'+s.kit.ink+'"><b>'+w.week+'</b></div></div></button>';
  }
  return '<button class="tile" style="background:linear-gradient(150deg,'+s.c1+','+s.c2+')" onclick="openViewer('+si+','+wi+')">'
    + '<div><div class="t-series">'+esc(s.title)+'</div>'
    + (s.subtitle?'<div class="t-ssub">'+esc(s.subtitle)+'</div>':'')
    + '<div class="t-wkline">'+wkline+'</div></div>'
    + '<div class="t-bottom"><div class="t-sec">'+w.cards.length+' cards</div>'
    + '<div class="t-num"><b>'+w.week+'</b></div></div></button>';
}
function renderHome(){
  let h = '<div class="h-title">Group Cards</div>'
        + '<div class="h-sub">Southeast Students &middot; Fall 2026</div>';
  DATA.series.forEach((s,si)=>{
    const ac = s.kit ? s.kit.bg : s.c1;
    h += '<div class="series"><div class="s-head" style="border-color:'+ac+'">'
       + '<span class="dot" style="background:'+ac+'"></span>'
       + '<h2>'+esc(s.title)+(s.subtitle?' <span class="sub">&middot; '+esc(s.subtitle)+'</span>':'')+'</h2></div>'
       + '<div class="weeks">';
    s.weeks.forEach((w,wi)=>{
      h += '<div class="wk-cell">'+tileHTML(s,si,w,wi)
         + '<div class="wk-actions">'
         + '<button onclick="copyLink(this,'+si+','+wi+')">Copy link</button>'
         + '<a href="'+w.pdf+'" download>PDF</a>'
         + '</div></div>';
    });
    h += '</div></div>';
  });
  document.getElementById('home').innerHTML = h;
}
function copyLink(btn,si,wi){
  const url=weekURL(si,wi);
  const done=()=>{const t=btn.textContent;btn.textContent='Copied!';btn.classList.add('copied');
                  setTimeout(()=>{btn.textContent=t;btn.classList.remove('copied');},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url,done));
  } else fallbackCopy(url,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){prompt('Copy this link:',text);}
  document.body.removeChild(ta);
}

/* ---------- VIEWER ---------- */
let cur = {si:0, wi:0, ci:0};
function S(){return DATA.series[cur.si];}
function W(){return S().weeks[cur.wi];}
function C(){return W().cards[cur.ci];}

function openViewer(si,wi){
  cur={si,wi,ci:0};
  document.getElementById('viewer').classList.add('on');
  renderCard();
  const h=weekHash(si,wi);
  if(location.hash!==h){ suppressHash=true; location.hash=h; }
}
function closeViewer(){
  document.getElementById('viewer').classList.remove('on');
  if(location.hash){ suppressHash=true;
    history.replaceState(null,'',location.pathname+location.search); }
}

function frontHTML(){
  const s=S(), w=W(), c=C();
  if(s.kit){
    const icon=(s.kit.weekIcons||[])[w.week-1];
    return '<div>'
         + (s.kit.wordmark
             ? '<img class="kit-wm" src="'+s.kit.wordmark+'" alt="">'
             : '<div class="s-name" style="color:'+s.kit.ink+'">'+esc(s.title)+'</div>'
               + (s.subtitle?'<div class="s-sub" style="color:'+s.kit.ink+'">'+esc(s.subtitle)+'</div>':''))
         + '<div class="kit-wk" style="color:'+s.kit.ink+'">Week '+w.week+(w.title?' &middot; '+esc(w.title):'')+'</div></div>'
         + (icon?'<div class="kit-ic"><img src="'+icon+'" alt=""></div>':'<div class="kit-ic"></div>')
         + '<div class="f-bottom"><div class="sec">'+esc(c.label)+'</div>'
         + '<div class="num"><b style="color:'+s.kit.ink+'">'+c.n+'</b><i>/'+c.total+'</i></div></div>'
         + '<div class="tap-hint">tap to read</div>';
  }
  return '<div><div class="s-name">'+esc(s.title)+'</div>'
       + (s.subtitle?'<div class="s-sub">'+esc(s.subtitle)+'</div>':'')
       + '<div class="wk-line">Week '+w.week+(w.title?' &middot; '+esc(w.title):'')+'</div></div>'
       + '<div class="f-bottom"><div class="sec">'+esc(c.label)+'</div>'
       + '<div class="num"><b>'+c.n+'</b><i>/'+c.total+'</i></div></div>'
       + '<div class="tap-hint">tap to read</div>';
}
function bodyHTML(c){
  if(c.kind==='intro'){
    return '<div>'+c.body.map(([k,v])=>{
      const blank=!(v&&String(v).trim());
      return '<div class="kv"><div class="k" style="color:'+S().c2+'">'+esc(k)+'</div>'
           + '<div class="v'+(blank?' blank':'')+'">'+(blank?'To be added':esc(v))+'</div></div>';
    }).join('')+'</div>';
  }
  if(c.kind==='list'){
    if(!c.body.length) return '<div class="blank">To be added</div>';
    return c.body.map(q=>{
      const m=String(q).match(/^\s*(\d+)[.)]\s*(.*)$/);
      if(m) return '<div class="qrow"><span class="qn" style="background:'+(S().kit?'#0e1215':S().c1)+'">'+m[1]+'</span>'+esc(m[2])+'</div>';
      return '<div class="qsub">'+esc(q)+'</div>';
    }).join('');
  }
  const raw=(c.body||'').toString().replace(/^["“”]+|["“”]+$/g,'').trim();
  if(!raw) return '<div class="prose blank">To be added</div>';
  const t = c.section==='Prayer' ? '“'+esc(raw)+'”' : esc(raw);
  return '<div class="prose">'+t+'</div>';
}
function backHTML(){
  const s=S(), w=W(), c=C();
  const bc = s.kit ? '#0e1215' : s.c1;
  const tc = s.kit ? '#556114' : s.c2;
  return '<div class="b-head" style="border-color:'+bc+';color:'+tc+'">'
       + '<div class="l">Week '+w.week+(w.title?' &middot; '+esc(w.title):'')+'</div>'
       + '<div class="r">'+c.n+'/'+c.total+'</div></div>'
       + '<div class="b-title">'+esc(c.label)+'</div>'
       + '<div class="b-body">'+bodyHTML(c)+'</div>'
       + '<div class="b-foot">Southeast Students</div>';
}
function renderCard(){
  const s=S(), w=W();
  const flip=document.getElementById('flip');
  flip.classList.remove('flipped');
  document.getElementById('front').style.background = s.kit ? s.kit.bg : 'linear-gradient(150deg,'+s.c1+','+s.c2+')';
  document.getElementById('front').innerHTML=frontHTML();
  document.getElementById('back').innerHTML=backHTML();
  document.getElementById('vcount').textContent='W'+w.week+' · '+(cur.ci+1)+'/'+w.cards.length;
  document.getElementById('vpdf').href=w.pdf;
  document.getElementById('pips').innerHTML=w.cards.map((_,i)=>'<span class="pip'+(i===cur.ci?' on':'')+'"></span>').join('');
  document.getElementById('prev').disabled = cur.ci===0;
  document.getElementById('next').disabled = cur.ci===w.cards.length-1;
}
function nav(d){
  const n=cur.ci+d;
  if(n<0||n>=W().cards.length) return;
  cur.ci=n; renderCard();
}
function flipCard(){ document.getElementById('flip').classList.toggle('flipped'); }

/* ---------- deep links ---------- */
let suppressHash=false;
function applyHash(){
  const m=(location.hash||'').match(/^#s(\d+)w(\d+)$/i);
  if(!m){ document.getElementById('viewer').classList.remove('on'); return; }
  const sn=+m[1], wn=+m[2];
  const si=DATA.series.findIndex(s=>s.n===sn);
  if(si<0) return;
  const wi=DATA.series[si].weeks.findIndex(w=>w.week===wn);
  if(wi<0) return;
  cur={si,wi,ci:0};
  document.getElementById('viewer').classList.add('on');
  renderCard();
}
window.addEventListener('hashchange',()=>{
  if(suppressHash){ suppressHash=false; return; }
  applyHash();
});

/* tap vs swipe */
let sx=0, sy=0, moved=false;
const stage=document.getElementById('stage');
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;},{passive:true});
stage.addEventListener('touchmove',e=>{
  if(Math.abs(e.touches[0].clientX-sx)>10||Math.abs(e.touches[0].clientY-sy)>10) moved=true;
},{passive:true});
stage.addEventListener('touchend',e=>{
  if(e.target.closest('.arrow')) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){ nav(dx<0?1:-1); }
  else if(!moved){ flipCard(); }
});
document.getElementById('flip').addEventListener('click',e=>{ if(!('ontouchstart' in window)) flipCard(); });
document.addEventListener('keydown',e=>{
  if(!document.getElementById('viewer').classList.contains('on')) return;
  if(e.key==='ArrowRight') nav(1);
  else if(e.key==='ArrowLeft') nav(-1);
  else if(e.key===' '||e.key==='Enter'){ flipCard(); e.preventDefault(); }
  else if(e.key==='Escape') closeViewer();
});

renderHome();
applyHash();
</script>
