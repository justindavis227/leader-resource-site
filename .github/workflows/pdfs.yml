# Rebuilds the downloadable PDFs whenever a page changes on main,
# then commits them back so Vercel serves PDFs that match the pages.
name: Rebuild PDFs

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'colors_and_type.css'
      - 'support.js'
      - 'deck-stage.js'
      - 'campus-map.js'
      - 'assets/**'
      - 'tools/**'
      - '.github/workflows/pdfs.yml'
  workflow_dispatch: {}   # "Run workflow" button in GitHub rebuilds every PDF

permissions:
  contents: write

# A newer push replaces a run still in progress. Nothing is lost: each run
# rebuilds everything that changed since the last successful PDF commit.
concurrency:
  group: rebuild-pdfs
  cancel-in-progress: true

jobs:
  pdfs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Chromium only, no system packages: the runner already has what Chrome needs,
      # and the apt-get step behind "--with-deps" kept timing out on GitHub's mirrors.
      # If the download fails, fall back to the Google Chrome preinstalled on the runner.
      - name: Install Playwright + Chromium
        run: |
          npm i --no-save --no-package-lock playwright@1.48.2
          npx playwright install chromium || echo "LRS_CHROME=$(command -v google-chrome || command -v google-chrome-stable)" >> "$GITHUB_ENV"

      - name: Work out which pages changed
        id: changed
        run: |
          # everything since the last time the robot committed PDFs
          base=$(git log -1 --format=%H --author='github-actions\[bot\]' -- pdf/ || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$base" ]; then
            echo "mode=--all" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
            cat "$RUNNER_TEMP/changed.txt"
            echo "mode=--changed $RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: Render PDFs
        env:
          LRS_PDF_CACHE: ${{ runner.temp }}/lrs-pdf-cache
        run: |
          echo "Chrome: $LRS_CHROME"
          node tools/build-pdfs.mjs ${{ steps.changed.outputs.mode }}

      # Mirror the PDFs to the Craft backup page (Leader Resource Site — PDF Backup).
      # Never blocks the PDFs: if Craft is down or the secret is missing, this step is skipped/ignored.
      - name: Back up PDFs to Craft
        continue-on-error: true
        env:
          CRAFT_API_URL: ${{ secrets.CRAFT_API_URL }}
          CRAFT_API_KEY: ${{ secrets.CRAFT_API_KEY }}
        run: node tools/craft-backup.mjs

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/
          if git diff --cached --quiet; then echo "PDFs already up to date"; exit 0; fi
          git commit -m "Rebuild PDFs"
          git pull --rebase origin main
          git push
